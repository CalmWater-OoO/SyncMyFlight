[project]
name = "App"
version = "0.1.0"
description = "App — Flight delay prediction"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
  "streamlit>=1.39",
  "pandas>=2.2.3",
  "numpy>=2.1",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "datasets>=3.0",
  "pyarrow>=17.0",
  "databricks-sql-connector>=3.4",
]

[project.scripts]
App = "app.main:app"

[tool.uv.sources]
App = { path = "src/app" }

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["E203","E266","E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-vv -ra"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
